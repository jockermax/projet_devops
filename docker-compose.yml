version: "3.8"
services:
  angular-app:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: angular-app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:80"
    environment:
      - TZ=Europe/Paris
    volumes:
      - nginx_logs:/var/log/nginx
    networks:
      - angular_net

volumes:
  nginx_logs:

networks:
  angular_net:
    driver: bridge
